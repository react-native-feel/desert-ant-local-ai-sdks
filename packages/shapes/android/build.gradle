plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.desertant.rn'
version = '0.1.0'

android {
  namespace 'ai.desertant.rn.shapes'
  defaultConfig {
    // The Shapes AAR's floor. LiteRT ships arm64-v8a and x86_64 only, so a build
    // that also targets armeabi-v7a gets an AAR with no matching .so; the
    // bundled config plugin narrows the app's abiFilters to match, and
    // `isSupported` answers honestly if something slipped through anyway.
    minSdkVersion 24
  }
}

dependencies {
  // Keep this pinned in lockstep with DESERT_ANT_CORE_VERSION in
  // packages/core/ios/DesertAntCore.podspec: the two native SDKs share an FFI
  // payload schema -- for Shapes, a point count and f64 x/y pairs in, a present
  // flag plus a kind tag and that kind's fields out -- so a mismatched pair is a
  // wire bug, not a build error. `ai.desertant:core` (LiteRT + the shared native
  // core) arrives transitively.
  implementation 'ai.desertant:shapes:3.1.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
